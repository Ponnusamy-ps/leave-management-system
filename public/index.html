<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Leave Management System</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container"><div class="logo"><img src="assets/dilogo.jpg" alt="Logo"></div><h1>Leave Management System</h1><p class="subtitle">Easily apply, track and manage your leaves.<br>Login or create your account to continue.</p>
<div class="auth-tabs"><button type="button" id="loginTab" class="tab active">Login</button><button type="button" id="signupTab" class="tab">Sign Up</button></div>
<div id="loginBox" class="login-box"><form id="loginForm"><div class="input-group"><label>👤 &nbsp; Username</label><input id="username" type="text" placeholder="Enter username" autocomplete="username" required></div><div class="input-group"><label>🔒 &nbsp; Password</label><input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required></div><h3>Select Access</h3><div class="access-options"><label class="access"><input type="radio" name="access" value="user" checked><span class="icon">👤</span><b>User</b><small>Employee Access</small></label><label class="access"><input type="radio" name="access" value="admin"><span class="icon">⚙</span><b>Admin</b><small>Administrator Access</small></label></div><button type="submit">Login</button><p id="loginMessage" class="message"></p></form></div>
<div id="signupBox" class="login-box hidden"><form id="signupForm"><div class="input-group"><label>👤 &nbsp; Full Name</label><input id="fullName" type="text" placeholder="Enter your full name" required></div><div class="input-group"><label>✉️ &nbsp; Email</label><input id="email" type="email" placeholder="Enter your email" autocomplete="email" required></div><div class="input-group"><label>🪪 &nbsp; Username</label><input id="signupUsername" type="text" placeholder="Create a username" autocomplete="username" required></div><div class="input-group"><label>🔒 &nbsp; Password</label><input id="signupPassword" type="password" placeholder="Minimum 6 characters" autocomplete="new-password" required></div><div class="input-group"><label>🔐 &nbsp; Confirm Password</label><input id="confirmPassword" type="password" placeholder="Re-enter your password" autocomplete="new-password" required></div><button type="submit">Create Account</button><p id="signupMessage" class="message"></p></form></div>
<div class="demo-box"><b>Admin account</b><span>Username: <code>admin</code> / Password: <code>admin123</code></span><small>New employees should use Sign Up to create their own account.</small></div></div><script src="app.js"></script></body></html>
